description: >
  Live dashboard of Ninja Van's Indonesia sales opportunity pipeline: stage
  funnel, win/loss split, product line and service level breakdowns, top
  salesperson leaderboard, deal aging, stage-bottleneck analysis, a 3-month
  close-date forecast, and opportunities created per month rolled up by
  Manager and Sales Head. Refreshed every 5 minutes from the Ninja Van
  SalesCRM API. For the Indonesia sales planning team.

